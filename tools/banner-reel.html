<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "../assets/vendor/three/three.module.min.js", "three/addons/": "../assets/vendor/three/addons/" } }</script>
<style>html,body{margin:0;background:#0c0c0c}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="820"></canvas>
<script type="module">
import { THREE, buildDesigns, makeBottle, envFor, blob } from "../assets/js/scene.js";
await document.fonts.ready;
await Promise.all(["400 40px 'Instrument Serif'","italic 400 40px 'Instrument Serif'","700 40px Montserrat","600 40px Montserrat","500 40px Montserrat"].map(f=>document.fonts.load(f).catch(()=>{})));
const W=1920,H=820, canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05; renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(); scene.background=new THREE.Color("#0c0c0c"); envFor(renderer,scene);
const key=new THREE.DirectionalLight(0xffffff,2); key.position.set(4,6,6); scene.add(key);
const rl=new THREE.DirectionalLight(0xffffff,2.4); rl.position.set(-6,3,-2); scene.add(rl);
const rr=new THREE.DirectionalLight(0xffffff,1.4); rr.position.set(6,2,-3); scene.add(rr);
scene.add(new THREE.AmbientLight(0xffffff,.25));
const designs=buildDesigns(), N=designs.length, R=4.4, TAU=Math.PI*2;
const ring=new THREE.Group(); scene.add(ring);
const items=designs.map((d,i)=>{const a=i/N*TAU,h=new THREE.Group();h.position.set(Math.sin(a)*R,0,Math.cos(a)*R);h.rotation.y=a;
 const sp=new THREE.Group(),b=makeBottle(d,renderer);b.position.y=-1.6;sp.add(b);h.add(sp);
 const g=blob("255,255,255",.14);g.scale.set(2.6,2.6,1);g.position.y=-1.61;h.add(g);ring.add(h);return {h,sp};});
const ped=new THREE.Mesh(new THREE.TorusGeometry(R,.006,8,200),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.12}));
ped.rotation.x=Math.PI/2; ped.position.y=-1.6; scene.add(ped);
const cam=new THREE.PerspectiveCamera(24,W/H,.1,100);
window.frame=(t)=>{ // t in [0,1)
  ring.rotation.y=-t*TAU;
  const mod=n=>((n%N)+N)%N;
  items.forEach((it,i)=>{const pos=t*N; let d=Math.abs(mod(i-pos+N/2)-N/2); const f=Math.max(0,1-d);
    it.h.scale.setScalar(.8+f*.3); it.sp.rotation.y=t*TAU*2; });
  cam.position.set(Math.sin(t*TAU)*.6, 1.7+Math.sin(t*TAU*2)*.15, R+11); cam.lookAt(0,-.15,R-3.2); cam.updateProjectionMatrix();
  renderer.render(scene,cam); return canvas.toDataURL("image/jpeg",.93);
};
window.ready=true;
</script></body></html>
